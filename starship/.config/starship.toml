"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:base)\
$os\
$username\
[](bg:muted fg:base)\
$directory\
[](bg:love fg:muted)\
$git_branch\
$git_status\
[](bg:rose fg:love)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](bg:foam fg:rose)\
[ ](fg:foam)\
$line_break$character"""

palette = 'rose_pine_moon'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
orange = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[palettes.rose_pine_dawn]
base = "#faf4ed"
surface = "#fffaf3"
overlay = "#f2e9e1"
muted = "#9893a5"
subtle = "#797593"
text = "#575279"
love = "#b4637a"
gold = "#ea9d34"
rose = "#d7827e"
pine = "#286983"
foam = "#56949f"
iris = "#907aa9"
highlight_low = "#f4ede8"
highlight_med = "#dfdad9"
highlight_high = "#cecacd"

[palettes.rose_pine_moon]
base = "#232136"
surface = "#2a273f"
overlay = "#393552"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ea9a97"
pine = "#3e8fb0"
foam = "#9ccfd8"
iris = "#c4a7e7"
highlight_low = "#2a283e"
highlight_med = "#44415a"
highlight_high = "#56526e"

[os]
disabled = false
style = "bg:base fg:text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:base fg:text"
style_root = "bg:base fg:text"
format = '[ $user ]($style)'

[directory]
style = "fg:text bg:muted"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:love"
format = '[[ $symbol $branch ](fg:text bg:love)]($style)'

[git_status]
style = "bg:love"
format = '[[($all_status$ahead_behind )](fg:text bg:love)]($style)'

[nodejs]
symbol = ""
style = "bg:rose"
format = '[[ $symbol( $version) ](fg:muted bg:rose)]($style)'

[c]
symbol = " "
style = "bg:rose"
format = '[[ $symbol( $version) ](fg:muted bg:rose)]($style)'

[rust]
symbol = ""
style = "bg:rose"
format = '[[ $symbol( $version) ](fg:muted bg:rose)]($style)'

[golang]
symbol = ""
style = "bg:rose"
format = '[[ $symbol( $version) ](fg:muted bg:rose)]($style)'

[php]
symbol = ""
style = "bg:rose"
format = '[[ $symbol( $version) ](fg:muted bg:rose)]($style)'

[java]
symbol = " "
style = "bg:rose"
format = '[[ $symbol( $version) ](fg:muted bg:rose)]($style)'

[kotlin]
symbol = ""
style = "bg:rose"
format = '[[ $symbol( $version) ](fg:muted bg:rose)]($style)'

[haskell]
symbol = ""
style = "bg:rose"
format = '[[ $symbol( $version) ](fg:muted bg:rose)]($style)'

[python]
symbol = ""
style = "bg:rose"
format = '[[ $symbol( $version) ](fg:muted bg:rose)]($style)'

[docker_context]
symbol = ""
style = "bg:mantle"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:peach"
format = '[[  $time ](fg:mantle bg:purple)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:gold)'
error_symbol = '[](bold fg:love)'
vimcmd_symbol = '[](bold fg:highlight_high)'
vimcmd_replace_one_symbol = '[](bold fg:iris)'
vimcmd_replace_symbol = '[](bold fg:foam)'
vimcmd_visual_symbol = '[](bold fg:overlay)'
